# GitHub Action: run skilled Agent Skill evals in CI, across multiple engines.
#
# This metadata file lives at the repo ROOT and the repo contains a SINGLE
# action — both are required for GitHub Marketplace listing/discoverability.
# `branding` (icon + color) is what renders on the Marketplace card.
name: 'Agent Skill Eval (skilled)'
description: 'Run skilled behavioral evals on your Agent Skills in CI — across claude_code, codex, qodercli, and qwen_code engines.'
author: 'skilled'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  engine:
    description: 'Agent engine: claude_code / codex / qodercli / qwen_code. Leave empty to let the repo''s eval.yaml declare it.'
    required: false
    default: ''
  model:
    description: 'Passed to `skilled run --model` when non-empty; otherwise the eval config / CLI default is used.'
    required: false
    default: ''
  provider:
    description: 'Resolves base-url from a built-in table (public: dashscope). Ignored when base-url is set.'
    required: false
    default: ''
  api-key:
    description: 'Model credential. engine non-empty -> routed to ANTHROPIC_API_KEY / OPENAI_API_KEY / QODER_PERSONAL_ACCESS_TOKEN; engine empty -> passed via `skilled --api-key`. Always source this from a GitHub secret.'
    required: false
    default: ''
  base-url:
    description: 'Model API endpoint (public). Defaults to the agent CLI''s own public endpoint when empty.'
    required: false
    default: ''
  open-sandbox-api-key:
    description: 'OPENSANDBOX_API_KEY; only needed when evals use the opensandbox environment.'
    required: false
    default: ''
  skill-target:
    description: 'Skill directory or eval config path, resolved against the checked-out repo root.'
    required: false
    default: '.'
  skilled-version:
    description: 'Fallback skilled version for custom images without skilled. The official image preinstalls a pinned version and ignores this input.'
    required: false
    default: '0.3.0'
  skilled-command:
    description: 'The skilled command itself; must start with `skilled`.'
    required: false
    default: 'skilled run'
  parallelism:
    description: 'Passed to `--parallelism` when non-empty (1-256).'
    required: false
    default: ''
  agent-install-command:
    description: 'Optional custom install command, for a custom image missing a target engine CLI.'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'skilled exit code (0 = all evals passed).'
  report-dir:
    description: 'Directory with the JSON / JUnit / HTML reports, relative to the workspace (e.g. skilled-workspace), so host steps can consume it.'

# Build this repository's translated action until a release image is published.
# Docker container actions require a Linux runner.
runs:
  using: docker
  image: action/Dockerfile
  args:
    - --engine
    - ${{ inputs.engine }}
    - --model
    - ${{ inputs.model }}
    - --provider
    - ${{ inputs.provider }}
    - --api-key
    - ${{ inputs.api-key }}
    - --base-url
    - ${{ inputs.base-url }}
    - --open-sandbox-api-key
    - ${{ inputs.open-sandbox-api-key }}
    - --skill-target
    - ${{ inputs.skill-target }}
    - --skilled-version
    - ${{ inputs.skilled-version }}
    - --skilled-command
    - ${{ inputs.skilled-command }}
    - --parallelism
    - ${{ inputs.parallelism }}
    - --agent-install-command
    - ${{ inputs.agent-install-command }}
