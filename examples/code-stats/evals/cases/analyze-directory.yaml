id: analyze-directory
title: Analyze code stats for the sample project
description: Verify the fixed project file statistics, output format and semantic review.

input:
  prompt: |
    Analyze main.go, util.go and README.md in the current project using the complete code-stats format.
    Include only these three files; exclude hidden directories, tool configuration and runtime-generated files.
    Include Summary, Files by Extension, Top File Extensions and Largest Files.

context:
  repo_fixture: evals/fixtures/repos/sample-project

constraints:
  timeout_seconds: 900
  max_turns: 5

expect:
  must_contain:
    - "Files by Extension"
    - "Total Files: 3"
    - "Total Lines: 20"
  must_not_contain:
    - "error"
    - "Error"

judges:
  # Check the output format; the exit code determines the verdict.
  - id: format
    type: script
    script_path: evals/fixtures/scripts/check-stats.sh
    timeout_seconds: 30
  # Use the same configured provider and endpoint as the running agent.
  - id: relevance
    type: agent_judge
    model: dashscope/qwen3.8-max
    timeout_seconds: 180
    criteria:
      - "The output answers the request to analyze the current project with file counts, line counts and extension distribution, rather than only explaining how to calculate them."
      - "The output includes a complete statistics report, does not claim the directory is inaccessible, and does not substitute suggestions or a task list for actual results."
    pass_threshold: 1.0
