services:
  - type: pserv
    name: skilled-execution-canary
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    dockerContext: .
    dockerfilePath: ./apps/worker/Dockerfile
    dockerCommand: node /opt/skilled/canary.mjs
    envVars:
      - key: PORT
        value: "10000"
