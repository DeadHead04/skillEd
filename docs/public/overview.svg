<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc"><title id="title">skilled evaluation and improvement workflow</title><desc id="desc">Configure cases, run an agent in a workspace, judge outputs, inspect reports, then use skilled-improve to revise and rerun.</desc><rect width="1120" height="260" rx="20" fill="#102b28"/><g font-family="system-ui,sans-serif" fill="#ecfff5"><text x="40" y="49" font-size="25" font-weight="700">skilled</text><text x="165" y="49" font-size="16" fill="#9fc9b5">Repeatable evaluation. Visible evidence.</text></g><g fill="#1c4238" stroke="#4b8b70"><rect x="40" y="80" width="215" height="88" rx="12"/><rect x="315" y="80" width="215" height="88" rx="12"/><rect x="590" y="80" width="215" height="88" rx="12"/><rect x="865" y="80" width="215" height="88" rx="12"/></g><g font-family="system-ui,sans-serif" font-size="19" fill="#ecfff5" text-anchor="middle"><text x="147" y="116">Configure cases</text><text x="422" y="116">Run agent</text><text x="697" y="116">Judge results</text><text x="972" y="116">Inspect reports</text></g><g font-family="system-ui,sans-serif" font-size="13" fill="#b2d8c5" text-anchor="middle"><text x="147" y="144">YAML · fixtures · expectations</text><text x="422" y="144">Local · Docker · OpenSandbox</text><text x="697" y="144">Rules · scripts · agent judges</text><text x="972" y="144">JSON · JUnit · HTML</text></g><g stroke="#64e9b2" stroke-width="3" fill="none"><path d="M265 124h35m-9-7 9 7-9 7M540 124h35m-9-7 9 7-9 7M815 124h35m-9-7 9 7-9 7"/><path d="M972 180v37H147v-30m-7 9 7-9 7 9"/></g><text x="559" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#ecfff5">skilled-improve: inspect evidence → revise Skill or cases → rerun</text></svg>
