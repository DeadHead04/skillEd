name: skilled
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skilled
      POSTGRES_PASSWORD: skilled
      POSTGRES_DB: skilled
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilled -d skilled"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3001:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://skilled:skilled@postgres:5432/skilled
      ARTIFACT_ROOT: /data/artifacts
      WORKER_STALE_AFTER_SECONDS: "30"
      SKILLED_ADAPTER_MODE: ${SKILLED_ADAPTER_MODE:-real}
      SKILLED_ADMIN_LOGIN_ID: ${SKILLED_ADMIN_LOGIN_ID:-admin}
      SKILLED_ADMIN_DISPLAY_NAME: ${SKILLED_ADMIN_DISPLAY_NAME:-Local administrator}
      SKILLED_ADMIN_PASSWORD: ${SKILLED_ADMIN_PASSWORD:-skilled-local}
      SKILLED_SESSION_SECRET: ${SKILLED_SESSION_SECRET:-local-development-session-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - artifacts:/data/artifacts

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://skilled:skilled@postgres:5432/skilled
      ARTIFACT_ROOT: /data/artifacts
      WORK_ROOT: /data/work
      CODEX_HOME: /home/skilled/.codex
      SKILLED_ADAPTER_MODE: ${SKILLED_ADAPTER_MODE:-real}
      SKILLED_EXECUTION_EVIDENCE: /data/acceptance/acceptance.json
      SKILLED_IMAGE_REVISION: ${SKILLED_IMAGE_REVISION:-}
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    # Allow the worker's 90-second drain plus database cleanup to complete.
    stop_grace_period: 110s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/docker/codex-seccomp.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/data/artifacts
      - work:/data/work
      - codex-home:/home/skilled/.codex
      - acceptance:/data/acceptance

volumes:
  postgres-data:
  artifacts:
  work:
  codex-home:
  acceptance:
