name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'package*.json', '.github/workflows/docs.yml']
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skilled-docs
          path: docs/.vitepress/dist/
          if-no-files-found: error
# Destination/Pages deployment is intentionally configured by the repository owner.
# This workflow currently builds a reviewable static site without publishing.
