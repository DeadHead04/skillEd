name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: skilled_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      SKILLED_TEST_DATABASE_URL: postgres://postgres:synthetic-test-password@127.0.0.1:5432/skilled_test
      SKILLED_PRIVATE_SERVICE_TESTS: "true"
      SKILLED_E2E_PASSWORD: deterministic-test-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: 1.25.5, cache-dependency-path: skill-up/go.sum }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build and test the pinned CLI without model calls
        working-directory: skill-up
        run: |
          go test ./internal/agent ./internal/judge ./internal/cli
          go build -trimpath -ldflags '-X main.version=skilled-v2' -o /tmp/skilled-skill-up ./cmd/skill-up
      - run: SKILLED_CONTRACT_CLI=/tmp/skilled-skill-up pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the credential-free installation
        run: docker compose -f compose.test.yaml up --build -d
      - name: Workbook artifact contract
        run: docker compose -f compose.test.yaml exec -T worker python3 packages/core/src/judge-harness-xlsx.test.py
      - name: Verify deterministic readiness
        run: COMPOSE_FILE=compose.test.yaml SKILLED_BASE_URL=http://127.0.0.1:3100 ./scripts/verify-stack.sh --demo
      - name: Browser journey and responsive checks
        run: PLAYWRIGHT_TEST_BASE_URL=http://127.0.0.1:3100 pnpm test:e2e
      - name: Diff whitespace check
        run: git diff --check
      - if: always() && hashFiles('compose.test.yaml') != ''
        run: docker compose -f compose.test.yaml down
