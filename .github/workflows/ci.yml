name: Phase 1 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skilled
          POSTGRES_USER: skilled
          POSTGRES_PASSWORD: skilled
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilled -d skilled"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://skilled:skilled@127.0.0.1:5432/skilled
      AUTH_SECRET: ci-auth-secret-with-enough-entropy
      DEV_AUTH_BYPASS: "true"
      APP_URL: http://127.0.0.1:3000
      ARTIFACT_ROOT: ./artifacts/ci
      IMPORT_STAGING_ROOT: ./tmp/ci-imports
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-browser-results
          path: test-results
          if-no-files-found: ignore
      - run: pnpm secrets:check
      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^
          fi

  skill-up:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Skill-Up changes
        id: changes
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^skill-up/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version-file: skill-up/go.mod
      - name: Test Skill-Up only when changed
        if: steps.changes.outputs.changed == 'true'
        working-directory: skill-up
        run: go test ./...
