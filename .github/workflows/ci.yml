name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run gate -- --phase=5
      - name: Verify isolated Docker benchmarks with real containers
        env:
          SKILLED_DOCKER_INTEGRATION: '1'
        run: node --test --test-concurrency=1 dist/tests/runtime/docker.test.js dist/tests/evaluator/benchmark-isolation.test.js dist/tests/evaluator/real.test.js dist/tests/runner/runner.test.js dist/tests/integration/phase3-pipeline.test.js dist/tests/integration/phase4-cli.test.js
      - run: npm run docs:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-evidence
          path: evidence/runs/
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Verify real MCP jobs and cancellation on this native OS
        # Process-lifecycle suites exercise real supervisors and OS process trees.
        # Match the main test gate's file-level isolation; tests within each suite
        # still exercise concurrent clients and workers explicitly.
        run: node --test --test-concurrency=1 dist/tests/mcp/server.test.js dist/tests/mcp/jobs.test.js dist/tests/mcp/shutdown.test.js
      - run: npm run package
      - name: Execute archive on its actual native target
        run: node scripts/verify-native-package.mjs
