name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'action.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'action.yml'
  merge_group:

permissions: {}

env:
  ZIZMOR_VERSION: 1.28.0

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Analyze workflows with Zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif

      - name: Retain workflow analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-analysis
          path: results.sarif
          if-no-files-found: error

      - name: Upload Zizmor SARIF
        if: github.event.repository.private == false || vars.SKILLED_CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: zizmor
