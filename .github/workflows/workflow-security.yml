name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'action.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'action.yml'
  merge_group:

permissions: {}

env:
  ZIZMOR_VERSION: 1.28.0

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Analyze workflows with Zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif

      - name: Retain workflow analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-analysis
          path: results.sarif
          if-no-files-found: error

      - name: Upload Zizmor SARIF
        if: github.event.repository.private == false || vars.SKILLED_CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: zizmor
